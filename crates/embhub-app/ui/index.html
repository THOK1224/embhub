<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>embhub — 串口助手</title>
  <style>
    /* ─────────────────────────────────────────────────────────────────────
       布局根因说明（t17，别删）：为什么以前「接收区一长就把下面挤没 / 重叠」
       ─────────────────────────────────────────────────────────────────────
       这个页面是 body 上的**纵向 flexbox**，整页高度锁一屏（html/body 100%）。
       纵向 flex 里有两类子项，规则必须分开写清楚，否则它们会互相挤：

       A. 固定内容区（工具行、计数行、发送区、事件区）：高度只由内容决定，
          必须 `flex: 0 0 auto`（**禁止收缩**）。以前所有 fieldset 都带
          `min-height: 0`，于是它们也会被 flex-shrink 压扁；而 overflow 默认
          visible，被压扁容器的内容就**直接溢出到下一个兄弟节点上**——
          用户在截图里看到的「事件与错误标题与定时发送间隔行重叠」就是这么来的。

       B. 接收区（.pane，唯一的伸缩区）：它要吃掉剩余高度并**自己滚动**，
          需要两件事同时成立：
            · `.pane { flex: 1 1 auto; min-height: 0 }` —— 纵向 flex 子项的
              自动最小高度默认等于其内容的 min-content 高度（滚动容器才豁免），
              `.pane` 自己不是滚动容器，不减到 0 就压不下去，剩余高度也就分不下来
              （captain 初判的那条经典缺陷，作用点在这里）；
            · 内部滚动容器 `#rx { flex: 1 1 auto; min-height: 0; overflow: auto }`
              —— 滚动子项同样要能缩得比内容矮，overflow 才会真的生效。
              以前 #rx 带着 `min-height: 110px` 硬下限，等于给接收区装了一条
              「再挤也不小于 ~160px」的底线：窗口一矮就把别人顶出可视区。

       所以修复不是给某个盒子写死高度，而是把「谁固定、谁伸缩、谁滚动」讲清楚：
       · 固定区永不收缩 → 内容永远不会溢出到兄弟身上（不再重叠，也不再被顶出去）；
       · 接收区可缩 + 内部滚动 → 内容再多也只在自己框里滚（页面布局高度不变）。
       body 上的 `overflow: auto` 只是最后兜底：窗口小到连固定区都放不下时整页滚动，
       而不是把内容切掉或压扁重叠。
       ───────────────────────────────────────────────────────────────────── */
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    * { box-sizing: border-box; }
    body {
      font-family: "Cascadia Mono", Consolas, monospace;
      margin: 0; padding: 12px; background: #14161a; color: #d7dae0;
      display: flex; flex-direction: column; gap: 10px;
      height: 100%;
      overflow: auto;   /* 兜底，见上方根因说明 */
      min-width: 0;
      /* 继承给所有文本：长行（例如无换行的 HEX 串）只在自己的框里换行，
         不会把面板、进而把整页撑出横向滚动条。 */
      overflow-wrap: anywhere;
    }
    /* A 类：固定内容区——尺寸只由内容决定，永不收缩。 */
    h1, #paramsHint, #counters, .row { flex: 0 0 auto; min-width: 0; }
    h1 { font-size: 14px; font-weight: 600; margin: 0; color: #8ab4f8; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      background: #2a2f3a; color: #d7dae0; border: 1px solid #3c4350;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px;
    }
    button:hover:not(:disabled) { background: #353b48; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #2b4a7d; border-color: #3d63a3; }
    button.danger { background: #5a2b2b; border-color: #8d4040; }
    select, input {
      background: #1c2027; color: #d7dae0; border: 1px solid #3c4350;
      padding: 6px; border-radius: 4px; font: inherit; font-size: 13px;
    }
    select:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
    #port { min-width: 230px; }
    #baud { width: 96px; }
    #timedInterval { width: 84px; }
    #txInput { flex: 1 1 auto; min-width: 180px; }
    label { font-size: 12.5px; color: #9aa4b2; display: inline-flex; gap: 4px; align-items: center; }
    fieldset {
      border: 1px solid #2a2f3a; border-radius: 4px; margin: 0; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 8px;
      min-width: 0;   /* 长内容不许把面板顶宽（横轴同理） */
    }
    /* A 类面板：内容固定，禁止收缩。 */
    fieldset.fixed { flex: 0 0 auto; }
    /* B 类面板：唯一的伸缩区，必须能缩到内容高度以下。 */
    fieldset.pane { flex: 1 1 auto; min-height: 0; }
    legend { font-size: 12px; color: #9aa4b2; padding: 0 4px; }
    #rx {
      background: #0e1014; border: 1px solid #2a2f3a; border-radius: 4px;
      padding: 8px; font-size: 12.5px; line-height: 1.45;
      /* 接收区自己滚：flex: 1 1 auto 吃掉 .pane 的剩余高度；
         min-height: 0 让它能缩得比内容矮（否则 overflow 永不生效）；
         不许写 min-height: <数字>px —— 那会把下方区域顶出窗口。 */
      flex: 1 1 auto; min-height: 0; min-width: 0; overflow: auto;
      /* 长行只在本框内换行/滚动，不撑宽页面。 */
      white-space: pre-wrap; overflow-wrap: anywhere;
      user-select: text;
    }
    #log {
      background: #0e1014; border: 1px solid #2a2f3a; border-radius: 4px;
      padding: 6px 8px; flex: 0 0 auto; height: 96px; overflow: auto;
      font-size: 12px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .ok { color: #7ee787; }
    .err { color: #ff7b72; }
    .dim { color: #6e7681; }
    .warn { color: #e3b341; }
    #counters { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
    #counters b { color: #8ab4f8; font-size: 15px; }
    #status { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #2a2f3a; }
    #status.on { background: #1f4d2b; color: #9be8a8; }
    #paramsHint { font-size: 12px; color: #6e7681; }
  </style>
</head>

<body>
  <h1>embhub — 串口助手（会话：源 + 落盘 + 发送）</h1>

  <!-- ① 刷新并列出端口  ② 端口与波特率  ③ 打开/关闭会话 -->
  <div class="row">
    <button id="refresh">刷新端口</button>
    <select id="port" title="串口列表来自 core 的 list_ports()"></select>
    <label>波特率 <input id="baud" list="bauds" value="115200" /></label>
    <datalist id="bauds">
      <option>9600</option><option>19200</option><option>38400</option><option>57600</option>
      <option>115200</option><option>230400</option><option>460800</option><option>921600</option>
    </datalist>
  </div>

  <!-- 帧格式四件套：数据位 / 校验位 / 停止位 / 流控 -->
  <div class="row">
    <label>数据位
      <select id="dataBits">
        <option value="8" selected>8</option>
        <option value="7">7</option>
        <option value="6">6</option>
        <option value="5">5</option>
      </select>
    </label>
    <label>校验位
      <select id="parity">
        <option value="none" selected>None</option>
        <option value="odd">Odd</option>
        <option value="even">Even</option>
      </select>
    </label>
    <label>停止位
      <select id="stopBits">
        <!-- 只给 1 与 2：serialport 4.x 没有 1.5 停止位，列出来等于给用户一个必然报错的选项 -->
        <option value="1" selected>1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>流控
      <select id="flowControl">
        <option value="none" selected>None</option>
        <option value="rtscts">RTS/CTS</option>
        <option value="xonxoff">XON/XOFF</option>
      </select>
    </label>
    <button id="open" class="primary">打开会话</button>
    <button id="close" class="danger" disabled>关闭会话</button>
    <span id="status">未连接</span>
  </div>
  <div id="paramsHint">运行中不可改参数：改参数 = 关闭后重新打开新会话（避免「界面显示 115200、实际跑 9600」这类误导）。</div>

  <!-- 三个计数 -->
  <div id="counters">
    <span>RX 字节 <b id="rxBytes">0</b></span>
    <span>TX 字节 <b id="txBytes">0</b></span>
    <span>显示丢弃字节 <b id="dropBytes">0</b></span>
    <span class="dim" id="extra"></span>
  </div>

  <!-- 接收区：文本/HEX、时间戳、清空、自动滚动 -->
  <!-- 接收区：唯一伸缩的面板（class="pane"），内部 #rx 自己滚动 -->
  <fieldset class="pane" id="rxPane">
    <legend>接收区</legend>
    <div class="row">
      <label><input type="radio" name="view" value="text" checked /> 文本</label>
      <label><input type="radio" name="view" value="hex" /> HEX</label>
      <label><input type="checkbox" id="showTs" /> 显示时间戳（墙上时钟，毫秒）</label>
      <button id="clear">清空</button>
      <label><input type="checkbox" id="autoscroll" checked /> 自动滚动</label>
      <span class="dim" id="rxHint">显示区只保留最近 256 KiB；落盘与计数不受影响</span>
    </div>
    <div id="rx"></div>
  </fieldset>

  <!-- 发送区：固定内容面板（class="fixed"，永不收缩，防止被接收区挤扁） -->
  <fieldset class="fixed" id="txPane">
    <legend>发送区</legend>
    <div class="row">
      <select id="txMode">
        <option value="text">文本</option>
        <option value="hex">HEX</option>
      </select>
      <select id="txAppend">
        <option value="none">不追加</option>
        <option value="cr">追加 CR</option>
        <option value="lf">追加 LF</option>
        <option value="crlf">追加 CRLF</option>
      </select>
      <input id="txInput" placeholder="文本模式直接输；HEX 模式输 AA55FF（可带空格）" />
      <button id="send" class="primary" disabled>发送</button>
      <span class="dim">Enter 亦可发送</span>
    </div>
    <div class="row">
      <label>定时发送间隔 <input id="timedInterval" value="1000" /> ms</label>
      <button id="timedStart" disabled>开始定时</button>
      <button id="timedStop" disabled>停止定时</button>
      <span class="dim" id="timedStatus">定时发送未运行</span>
    </div>
    <div class="dim">
      定时发送与手动发送共用同一套 mode/append 解析（字节完全一致）；关闭会话会自动停掉定时器。
    </div>
  </fieldset>

  <!-- 事件与错误：同样是固定内容面板（永不收缩） -->
  <fieldset class="fixed" id="logPane">
    <legend>事件与错误（失败原因都在这里）</legend>
    <div id="log"></div>
  </fieldset>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const { listen } = window.__TAURI__.event;

    // ---- DOM ----
    const portEl = document.getElementById("port");
    const baudEl = document.getElementById("baud");
    const dataBitsEl = document.getElementById("dataBits");
    const parityEl = document.getElementById("parity");
    const stopBitsEl = document.getElementById("stopBits");
    const flowControlEl = document.getElementById("flowControl");
    const openBtn = document.getElementById("open");
    const closeBtn = document.getElementById("close");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const rxEl = document.getElementById("rx");
    const logEl = document.getElementById("log");
    const rxBytesEl = document.getElementById("rxBytes");
    const txBytesEl = document.getElementById("txBytes");
    const dropBytesEl = document.getElementById("dropBytes");
    const extraEl = document.getElementById("extra");
    const txInput = document.getElementById("txInput");
    const txMode = document.getElementById("txMode");
    const txAppend = document.getElementById("txAppend");
    const autoscrollEl = document.getElementById("autoscroll");
    const showTsEl = document.getElementById("showTs");
    const timedIntervalEl = document.getElementById("timedInterval");
    const timedStartBtn = document.getElementById("timedStart");
    const timedStopBtn = document.getElementById("timedStop");
    const timedStatusEl = document.getElementById("timedStatus");

    // ---- 状态 ----
    let running = false;
    let lastFatal = null;
    let lastTxError = null;
    let lastTimedNote = null;
    // 接收区保留的批次（用于切换 文本/HEX/时间戳 时重渲染）。只影响**显示**，不影响落盘与计数。
    const MAX_RENDER_BYTES = 256 * 1024;
    let chunks = []; // 每条：{ t_mono, wall_ms, bytes }
    let retained = 0;
    let streamDecoder = new TextDecoder("utf-8", { fatal: false });

    function log(msg, cls) {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      line.textContent = `[${t}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    const viewMode = () => document.querySelector('input[name="view"]:checked').value;
    const showTimestamps = () => showTsEl.checked;
    const hexOf = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    /** 墙上时钟（epoch 毫秒，后端按会话创建点精确换算）→ 本地时间 HH:MM:SS.mmm。 */
    function fmtWall(ms) {
      const d = new Date(ms);
      const p = (n, w = 2) => String(n).padStart(w, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
    }

    /** 把一条批次渲染成文本（时间戳开关只影响这里）。 */
    function renderChunk(chunk, isFirstLine) {
      const body = viewMode() === "hex"
        ? hexOf(chunk.bytes)
        : new TextDecoder("utf-8", { fatal: false }).decode(chunk.bytes);
      if (!showTimestamps()) return body;
      return `${isFirstLine ? "" : "\n"}[${fmtWall(chunk.wall_ms)}] ${body}`;
    }

    function appendText(text) {
      rxEl.appendChild(document.createTextNode(text));
      if (autoscrollEl.checked) rxEl.scrollTop = rxEl.scrollHeight;
    }

    /** 重渲染整个保留区（切模式 / 切时间戳 / 清空后用），顺带重置流式解码器。 */
    function rerender() {
      rxEl.textContent = "";
      streamDecoder = new TextDecoder("utf-8", { fatal: false });
      chunks.forEach((c, i) => appendText(renderChunk(c, i === 0)));
    }

    /** 追加一批。文本模式且没开时间戳时走流式解码（跨批次多字节字符不会变乱码）。 */
    function onBatch(payload) {
      const bytes = hexToBytes(payload.hex);
      const chunk = { t_mono: payload.t_mono, wall_ms: payload.wall_ms, bytes };
      const wasEmpty = chunks.length === 0;
      chunks.push(chunk);
      retained += bytes.length;
      while (retained > MAX_RENDER_BYTES && chunks.length > 1) {
        retained -= chunks.shift().bytes.length; // 只裁剪显示缓冲；计数与落盘不受影响
      }
      if (showTimestamps() || viewMode() === "hex") {
        appendText(renderChunk(chunk, wasEmpty));
      } else {
        appendText(streamDecoder.decode(bytes, { stream: true }));
      }
    }

    // ---- 会话控制 ----
    function setRunning(on) {
      running = on;
      openBtn.disabled = on;
      closeBtn.disabled = !on;
      sendBtn.disabled = !on;
      timedStartBtn.disabled = !on;
      timedStopBtn.disabled = true; // 由 stats 轮询按实际状态打开
      for (const el of [portEl, baudEl, dataBitsEl, parityEl, stopBitsEl, flowControlEl]) {
        el.disabled = on; // 运行中不可改参数（改参数 = 新会话）
      }
      statusEl.textContent = on ? "已连接" : "未连接";
      statusEl.className = on ? "on" : "";
      if (!on) {
        timedStatusEl.textContent = "定时发送未运行";
        lastTimedNote = null;
      }
    }

    async function refreshPorts() {
      try {
        const ports = await invoke("list_ports");
        portEl.innerHTML = "";
        if (ports.length === 0) {
          log("未发现任何串口：请检查设备是否插好、驱动是否装好（core 枚举结果为空）", "err");
          return;
        }
        for (const p of ports) {
          const opt = document.createElement("option");
          opt.value = p.port_name;
          const id = (p.vid != null && p.pid != null)
            ? ` VID:PID=${p.vid.toString(16).padStart(4, "0").toUpperCase()}:${p.pid.toString(16).padStart(4, "0").toUpperCase()}`
            : "";
          opt.textContent = `${p.port_name} [${p.port_type}]${id}${p.product ? " " + p.product : ""}`;
          portEl.appendChild(opt);
        }
        log(`发现 ${ports.length} 个串口：${ports.map((p) => p.port_name).join(", ")}`, "ok");
      } catch (e) {
        log(`枚举串口失败：${e}`, "err");
      }
    }

    async function openSession() {
      const port = portEl.value;
      if (!port) { log("请先刷新并选择一个端口", "err"); return; }
      const baud = parseInt(baudEl.value, 10);
      if (!Number.isFinite(baud) || baud <= 0) { log(`波特率不合法：${baudEl.value}`, "err"); return; }
      // 一个配置对象传全部参数（后端据此构造 core 的 SerialFrame）
      const config = {
        port,
        baud,
        dataBits: dataBitsEl.value,
        parity: parityEl.value,
        stopBits: stopBitsEl.value,
        flowControl: flowControlEl.value,
      };
      try {
        const info = await invoke("open_session", { config });
        setRunning(true);
        log(`会话已开启：${info.port} @ ${info.baud} ${info.frame}`, "ok");
        log(`会话 id ${info.session_id}；日志目录 ${info.session_dir}`, "dim");
        log(
          `时间戳基准：start_wall_ms=${info.start_wall_ms} / start_mono_micros=${info.start_mono_micros}（会话创建点，非首批到达时刻）`,
          "dim",
        );
      } catch (e) {
        // 失败原因原样来自后端：参数冲突（core 给的具体冲突说明）、端口不在列表、可能被占用…
        log(`打开失败：${e}`, "err");
        setRunning(false);
      }
    }

    async function closeSession() {
      try {
        const info = await invoke("close_session");
        setRunning(false);
        log(
          `会话已关闭：${info.port}（RX ${info.rx_bytes} / TX ${info.tx_bytes} / 显示丢弃 ${info.display_dropped_bytes} / 定时发送 ${info.timed_send_count} 帧）`,
          "ok",
        );
        log(`日志已落盘：${info.session_dir}`, "dim");
      } catch (e) {
        log(`关闭失败：${e}`, "err");
      }
      refreshStats();
    }

    // ---- 计数（后端权威，前端不自己算 RX/TX）----
    async function refreshStats() {
      let s;
      try {
        s = await invoke("session_stats");
      } catch (e) {
        log(`读计数失败：${e}`, "err");
        return;
      }
      rxBytesEl.textContent = s.rx_bytes;
      txBytesEl.textContent = s.tx_bytes;
      dropBytesEl.textContent = s.display_dropped_bytes;
      extraEl.textContent = s.running
        ? `${s.port} @ ${s.baud} ${s.frame} / 已落盘 ${s.logged_bytes} 字节 / TX 次数 ${s.tx_writes} / 发送失败 ${s.tx_errors}`
        : (s.port ? `上一次会话 ${s.port} @ ${s.baud} ${s.frame}（已停止，计数为最终值）` : "");

      if (s.running !== running) setRunning(s.running);

      // 定时发送：按钮可用性与状态说明都随真实状态变化
      timedStartBtn.disabled = !s.running;
      timedStopBtn.disabled = !s.timed_send_running;
      if (s.timed_send_running) {
        timedStatusEl.textContent = `定时发送中：每 ${s.timed_send_interval_ms} ms 一帧，已发 ${s.timed_send_count} 帧`;
      } else if (s.timed_send_count > 0) {
        timedStatusEl.textContent = `定时发送已停止（共 ${s.timed_send_count} 帧）`;
      } else {
        timedStatusEl.textContent = "定时发送未运行";
      }
      if (s.timed_send_note && s.timed_send_note !== lastTimedNote) {
        lastTimedNote = s.timed_send_note;
        log(`定时发送：${s.timed_send_note}`, "warn");
      }

      if (s.fatal_error && s.fatal_error !== lastFatal) {
        lastFatal = s.fatal_error;
        log(`采集已停止（致命错误）：${s.fatal_error}`, "err");
      }
      if (s.tx_errors > 0 && s.last_error && s.last_error !== lastTxError) {
        lastTxError = s.last_error;
        log(`发送失败：${s.last_error}`, "err");
      }
      if (s.display_dropped_bytes > 0) {
        extraEl.className = "warn";
        extraEl.textContent += `　⚠ 显示已丢弃 ${s.display_dropped_bytes} 字节（${s.display_dropped_batches} 批）；落盘不受影响`;
      } else {
        extraEl.className = "dim";
      }
    }

    // ---- 发送 ----
    async function send() {
      try {
        const r = await invoke("send_data", {
          data: txInput.value,
          mode: txMode.value,
          append: txAppend.value,
        });
        log(`已发送 ${r.bytes} 字节（HEX ${r.hex}）；累计 TX ${r.total_tx_bytes} 字节`, "ok");
        txInput.value = "";
      } catch (e) {
        log(`发送失败：${e}`, "err");
      }
    }

    // ---- 定时发送 ----
    async function startTimedSend() {
      const interval = Number(timedIntervalEl.value.trim());
      if (!Number.isInteger(interval) || interval <= 0) {
        log(`定时发送间隔非法：${timedIntervalEl.value}（必须是 ≥ 1 的整数毫秒）`, "err");
        return;
      }
      try {
        const r = await invoke("start_timed_send", {
          intervalMs: interval,
          data: txInput.value,
          mode: txMode.value,
          append: txAppend.value,
        });
        log(`定时发送已启动：每 ${r.interval_ms} ms 发一帧 ${r.frame_bytes} 字节（HEX ${r.frame_hex}）`, "ok");
      } catch (e) {
        log(`定时发送启动失败：${e}`, "err");
      }
      refreshStats();
    }

    async function stopTimedSend() {
      try {
        const r = await invoke("stop_timed_send");
        log(`定时发送已停止：共发出 ${r.count} 帧（间隔 ${r.interval_ms} ms）`, "ok");
      } catch (e) {
        log(`停止定时发送失败：${e}`, "err");
      }
      refreshStats();
    }

    // ---- 绑定 ----
    document.getElementById("refresh").addEventListener("click", refreshPorts);
    openBtn.addEventListener("click", openSession);
    closeBtn.addEventListener("click", closeSession);
    sendBtn.addEventListener("click", send);
    timedStartBtn.addEventListener("click", startTimedSend);
    timedStopBtn.addEventListener("click", stopTimedSend);
    document.getElementById("clear").addEventListener("click", () => {
      chunks = [];
      retained = 0;
      rerender();
      log("接收区已清空（落盘与计数不受影响）", "dim");
    });
    for (const radio of document.querySelectorAll('input[name="view"]')) {
      radio.addEventListener("change", rerender);
    }
    showTsEl.addEventListener("change", rerender);
    txInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });

    // 显示批次：节奏由 core 的批量策略决定（≥8 KiB 或 ≥30 ms）；
    // `wall_ms` 由后端用 core 的会话起点精确换算，前端不做任何近似。
    listen("session-batch", (event) => onBatch(event.payload)).catch((e) => {
      log(`事件订阅失败（接收区将不会有数据）：${e}`, "err");
    });

    setRunning(false);
    refreshPorts();
    refreshStats();
    setInterval(refreshStats, 500);
  </script>
</body>

</html>
